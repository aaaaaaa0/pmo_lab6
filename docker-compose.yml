version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: titanic_user
      POSTGRES_PASSWORD: titanic_pass
      POSTGRES_DB: titanic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titanic_user -d titanic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://titanic_user:titanic_pass@db:5432/titanic_db
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: